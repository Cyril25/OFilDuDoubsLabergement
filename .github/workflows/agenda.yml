name: Mise à jour agenda (DATAtourisme)

on:
  schedule:
    - cron: '23 0 * * *'      # tous les jours à 00:23 UTC (02:23 été / 01:23 hiver) - tôt + minute non ronde pour maximiser la marge avant 7h locale
  workflow_dispatch:           # déclenchement manuel possible

permissions:
  contents: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Télécharger et décompresser le flux DATAtourisme
        env:
          DATATOURISME_URL: ${{ secrets.DATATOURISME_URL }}
        run: |
          set -e
          if [ -z "$DATATOURISME_URL" ]; then
            echo "::error::Le secret DATATOURISME_URL n'est pas défini."
            exit 1
          fi
          # Le flux peut être en cours de régénération côté DATAtourisme (réponse JSON de
          # quelques centaines d'octets) : on réessaie avant d'abandonner.
          for i in 1 2 3 4 5; do
            code=$(curl -sSL -o flux.bin -w '%{http_code}' "$DATATOURISME_URL" || echo 000)
            size=$(stat -c%s flux.bin 2>/dev/null || echo 0)
            if [ "$code" = "200" ] && [ "$size" -ge 10000 ]; then break; fi
            echo "Tentative $i : HTTP $code, $size octets. Réponse :"
            head -c 500 flux.bin || true; echo
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "::error::DATAtourisme refuse la clé d'application (HTTP $code) — flux ou application désactivé. Régénérer l'URL sur diffuseur.datatourisme.fr puis mettre à jour le secret DATATOURISME_URL."
              exit 1
            fi
            if [ "$i" = 5 ]; then
              echo "::error::Flux DATAtourisme toujours indisponible après 5 tentatives (HTTP $code, $size octets)."
              exit 1
            fi
            sleep 60
          done
          gzip -dc flux.bin > flux.zip
          mkdir -p extracted
          unzip -q -o flux.zip -d extracted

      - name: Construire data/agenda.json
        run: node scripts/build-agenda.js extracted data/agenda.json 20

      - name: Compléter les traductions manquantes (DeepL)
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/translate-agenda.js data/agenda.json data/agenda-i18n-cache.json

      - name: Commit si l'agenda a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/agenda.json data/agenda-i18n-cache.json
          if git diff --cached --quiet; then
            echo "Aucun changement dans l'agenda."
          else
            git commit -m "chore(agenda): mise à jour automatique des événements"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push tentative $i rejetée, nouvelle tentative…"; sleep 5
            done
          fi
