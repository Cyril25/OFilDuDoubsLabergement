name: Mise à jour agenda (DATAtourisme)

on:
  schedule:
    - cron: '23 0 * * *'      # tous les jours à 00:23 UTC (02:23 été / 01:23 hiver) - tôt + minute non ronde pour maximiser la marge avant 7h locale
  workflow_dispatch:           # déclenchement manuel possible

permissions:
  contents: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Source principale depuis le 19/08/2026 : l'export régional publié sur data.gouv.fr.
      # Il vient de la même base que le flux du diffuseur, mais ne dépend ni d'une clé
      # d'application ni d'une sélection à maintenir — le flux, lui, s'est vidé sans préavis.
      - name: Télécharger l'export DATAtourisme (data.gouv.fr)
        run: |
          set -e
          # URL stable de la ressource datatourisme-reg-bfc.csv : elle redirige vers le
          # fichier du jour, dont le chemin contient un horodatage qui change chaque nuit.
          curl -sSL --retry 5 --retry-delay 30 --retry-all-errors             "https://www.data.gouv.fr/fr/datasets/r/d92f0184-e9cb-4bc9-81b0-b43fbcf2a0d2" -o bfc.csv
          size=$(stat -c%s bfc.csv 2>/dev/null || echo 0)
          echo "Export BFC : $size octets"
          if [ "$size" -lt 1000000 ]; then
            echo "::warning::Export data.gouv anormalement petit ($size octets) — on poursuit sans lui."
            head -c 300 bfc.csv; echo
            rm -f bfc.csv
          fi

      # Complément : le flux apporte les libellés multilingues natifs et l'identifiant SIT,
      # qui permet la jointure exacte avec les photos Tourinsoft. Son indisponibilité ne
      # doit plus bloquer la mise à jour de l'agenda, d'où le continue-on-error.
      - name: Télécharger et décompresser le flux du diffuseur
        id: flux
        continue-on-error: true
        env:
          DATATOURISME_URL: ${{ secrets.DATATOURISME_URL }}
        run: |
          set -e
          if [ -z "$DATATOURISME_URL" ]; then
            echo "::error::Le secret DATATOURISME_URL n'est pas défini."
            exit 1
          fi
          bash scripts/fetch-flux-datatourisme.sh "$DATATOURISME_URL" extracted

      - name: Publier le flux brut si le téléchargement a échoué
        if: steps.flux.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: flux-brut-agenda
          path: flux.bin
          if-no-files-found: ignore
          retention-days: 7

      - name: Signaler un flux diffuseur indisponible
        if: steps.flux.outcome == 'failure'
        run: echo "::warning::Flux du diffuseur indisponible — agenda construit depuis le seul export data.gouv.fr (descriptions limitées à ce que fournit Tourinsoft)."

      - name: Construire data/agenda.json
        run: node scripts/build-agenda.js extracted data/agenda.json 20 bfc.csv

      - name: Compléter les traductions manquantes (DeepL)
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/translate-agenda.js data/agenda.json data/agenda-i18n-cache.json

      - name: Commit si l'agenda a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/agenda.json data/agenda-i18n-cache.json
          if git diff --cached --quiet; then
            echo "Aucun changement dans l'agenda."
          else
            git commit -m "chore(agenda): mise à jour automatique des événements"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push tentative $i rejetée, nouvelle tentative…"; sleep 5
            done
          fi
